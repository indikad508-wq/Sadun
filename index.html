<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sadun AI</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0f172a;
  color: white;
}

header {
  background: #111827;
  padding: 18px;
  text-align: center;
  font-size: 23px;
  font-weight: bold;
  border-bottom: 1px solid #334155;
}

header span {
  color: #38bdf8;
}

.container {
  max-width: 750px;
  margin: auto;
  padding: 20px;
}

.welcome {
  text-align: center;
  margin-top: 100px;
}

.welcome h1 {
  font-size: 35px;
}

.welcome p {
  color: #94a3b8;
}

#chat {
  padding-bottom: 100px;
}

.message {
  padding: 14px;
  margin: 15px 0;
  border-radius: 12px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.user {
  background: #2563eb;
  margin-left: 40px;
}

.bot {
  background: #1e293b;
  margin-right: 40px;
}

.input-area {
  position: fixed;
  bottom: 0;
  left: 0;
  width: 100%;
  background: #0f172a;
  padding: 15px;
  border-top: 1px solid #334155;
}

.input-box {
  max-width: 750px;
  margin: auto;
  display: flex;
  gap: 10px;
}

input {
  flex: 1;
  padding: 16px;
  border: 1px solid #475569;
  border-radius: 12px;
  background: #1e293b;
  color: white;
  font-size: 16px;
  outline: none;
}

button {
  background: #2563eb;
  color: white;
  border: none;
  padding: 15px 20px;
  border-radius: 12px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  background: #1d4ed8;
}

</style>
</head>

<body>

<header>🤖 <span>Sadun</span> AI</header>

<div class="container">

<div class="welcome" id="welcome">
<h1>✨ Hello! I'm Sadun AI</h1>
<p>Your AI assistant. Ask me anything!</p>
</div>

<div id="chat"></div>

</div>

<div class="input-area">
<div class="input-box">
<input id="message" type="text"
placeholder="Message Sadun AI..."
onkeydown="if(event.key==='Enter') sendMessage()">

<button onclick="sendMessage()">Send ➤</button>
</div>
</div>

<script>

function addMessage(text, type) {
  const chat = document.getElementById("chat");

  const div = document.createElement("div");
  div.className = "message " + type;
  div.textContent = text;

  chat.appendChild(div);
  window.scrollTo(0, document.body.scrollHeight);
}

function sendMessage() {

  const input = document.getElementById("message");
  const text = input.value.trim();

  if (!text) return;

  document.getElementById("welcome").style.display = "none";

  addMessage(text, "user");

  input.value = "";

  addMessage(
    "ආයුබෝවන්! ❤️ මම Sadun AI. සැබෑ AI පිළිතුරු ලබාදීමට මගේ AI සේවාදායකය සම්බන්ධ කළ යුතුයි.",
    "bot"
  );

}

</script>

</body>
</html>
